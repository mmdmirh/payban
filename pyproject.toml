[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "payban"
version = "0.1.0"
description = "Iranian payment gateway clients (Zarinpal, Mellat/Behpardakht) with actionable Persian errors and Iran-proxy routing for foreign-hosted servers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25",
]
keywords = ["zarinpal", "mellat", "behpardakht", "shaparak", "payment", "iran"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]

[project.optional-dependencies]
mellat = ["zeep>=4.0"]

[project.urls]
Homepage = "https://github.com/mmdmirh/payban"

[tool.setuptools]
packages = ["payban"]
